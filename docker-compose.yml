# ==============================================================================
# Docker Compose Orchestration - Đề 26: Hệ thống Quản lý Sự kiện
# Kiến trúc 4 mạng phân tách (edge, app, monitor, egress)
# Hardening bảo mật cao cấp: Non-root, Read-only, Cap-drop ALL, Resource Limits
# Giám sát toàn diện: Prometheus + Grafana + Loki + Promtail + cAdvisor + Exporters
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Cơ sở dữ liệu PostgreSQL 17 (Chỉ nằm trên mạng nội bộ 'app')
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: eventify_postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-event_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      EXPORTER_DB_USER: ${EXPORTER_DB_USER:-event_exporter}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Dịch vụ Backend (Node.js Express TypeScript, Multi-stage, Non-root)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventify_backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-eventdb}
      APP_DB_USER: ${APP_DB_USER:-event_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-jwt_secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - edge
      - monitor

  # ----------------------------------------------------------------------------
  # 3. Dịch vụ Frontend (React Vite + Nginx Unprivileged Alpine)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventify_frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - edge

  # ----------------------------------------------------------------------------
  # 4. Quản trị Cơ sở dữ liệu pgAdmin 4
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eventify_pgadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@eventify26.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-AdminPass123!}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - ./postgres/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - edge

  # ----------------------------------------------------------------------------
  # 5. Reverse Proxy & SSL Termination Nginx (Non-root user UID 101)
  # CHỈ DUY NHẤT DỊCH VỤ NÀY ĐƯỢC PUBLISH PORT RA NGOÀI MÁY CHỦ (80, 443)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: eventify_nginx
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/auth:/etc/nginx/auth:ro
    depends_on:
      - backend
      - frontend
      - pgadmin
      - grafana
      - prometheus
    networks:
      - edge
      - monitor

  # ============================================================================
  # MONITORING & LOGGING STACK
  # ============================================================================

  # ----------------------------------------------------------------------------
  # 6. Prometheus - Thu thập & lưu trữ metrics (Basic Auth bảo vệ qua Nginx)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: eventify_prometheus
    restart: unless-stopped
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.external-url=/prometheus/"
      - "--web.route-prefix=/"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitor
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 7. Grafana - Visualize metrics & logs, chạy trên sub-path /grafana/
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2.3
    container_name: eventify_grafana
    restart: unless-stopped
    user: "472:472"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-GrafanaPass123!}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cadvisor.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - monitor
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/grafana/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 8. cAdvisor - Giám sát CPU/RAM/Mạng theo container Docker
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: eventify_cadvisor
    restart: unless-stopped
    privileged: true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    command:
      - "--housekeeping_interval=15s"
      - "--docker_only=true"
      - "--disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,referenced_memory,resctrl,sched,tcp,udp"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 9. Postgres Exporter - Xuất metrics PostgreSQL cho Prometheus
  # ----------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: eventify_postgres_exporter
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      DATA_SOURCE_NAME: "postgresql://${EXPORTER_DB_USER:-event_exporter}:${EXPORTER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-eventdb}?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - monitor
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 10. Nginx Exporter - Xuất metrics Nginx stub_status cho Prometheus
  # ----------------------------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    container_name: eventify_nginx_exporter
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    command:
      - "--nginx.scrape-uri=http://nginx:8081/stub_status"
    depends_on:
      - nginx
    networks:
      - edge
      - monitor

  # ----------------------------------------------------------------------------
  # 11. Loki - Lưu trữ và đánh chỉ mục Log tập trung (Lưu trữ 7 ngày)
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.6.17
    container_name: eventify_loki
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitor

  # ----------------------------------------------------------------------------
  # 12. Promtail - Thu thập Docker JSON Log ở chế độ Read-Only và chuyển tiếp tới Loki
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.6.11
    container_name: eventify_promtail
    restart: unless-stopped
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitor

# ==============================================================================
# Phân chia 4 Mạng Cách Ly & Volumes Lưu Trữ Bền Vững
# ==============================================================================
networks:
  # 1. Mạng edge: Ingress công khai cho Nginx tiếp nhận traffic (publish 80/443)
  edge:
    name: eventify_edge
    driver: bridge

  # 2. Mạng app: Mạng nội bộ cách ly an toàn tuyệt đối cho Postgres & Backend
  app:
    name: eventify_app
    driver: bridge
    internal: true

  # 3. Mạng monitor: Mạng giám sát nội bộ cách ly cho Prometheus/Grafana/Loki/Exporters
  monitor:
    name: eventify_monitor
    driver: bridge
    internal: true

  # 4. Mạng egress: Mạng dành cho các luồng kết nối ngoại vi (External outbound traffic)
  egress:
    name: eventify_egress
    driver: bridge

volumes:
  pgdata:
    name: eventify_pgdata
  pgadmin_data:
    name: eventify_pgadmin_data
  prometheus_data:
    name: eventify_prometheus_data
  grafana_data:
    name: eventify_grafana_data
  loki_data:
    name: eventify_loki_data
