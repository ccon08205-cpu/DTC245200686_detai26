# ==============================================================================
# Nginx Configuration for Reverse Proxy & SSL Termination
# Đề 26: Hệ thống Quản lý Sự kiện (Event Management System)
# Chạy với image nginx-unprivileged (Non-root user UID 101)
# Bao gồm: Grafana /grafana/, Prometheus /prometheus/ (basic auth), stub_status
# ==============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Tối ưu hóa file transfer
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Định dạng Log chi tiết chuẩn
    log_format custom_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               'rt=$request_time uct="$upstream_connect_time" '
                               'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /tmp/access.log custom_combined;
    error_log /tmp/error.log warn;

    # Gzip nén dữ liệu
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cấu hình Rate Limiting chống spam và tấn công DoS API (10 requests/giây cho mỗi IP)
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;
    limit_req_status 429;

    # ==========================================================================
    # 1. HTTP SERVER: Chuyển hướng 301 toàn bộ traffic HTTP -> HTTPS
    # Lắng nghe tại cổng unprivileged 8080 (được Docker map ra host 80)
    # ==========================================================================
    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        # Nginx stub_status - port 8080 chỉ dùng để redirect sang HTTPS
        # (stub_status đã được chuyển sang server block riêng trên port 8081)

        # Phục vụ ACME Challenge nếu gia hạn cert thật hoặc chuyển hướng 301 sang HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # 1b. INTERNAL METRICS SERVER: stub_status trên port 8081
    # Không expose ra host - chỉ dành cho nginx-exporter container truy cập nội bộ
    # ==========================================================================
    server {
        listen 8081;
        listen [::]:8081;
        server_name _;
        access_log off;

        location /stub_status {
            stub_status on;
        }

        # Chặn mọi path khác
        location / {
            return 404;
        }
    }

    # ==========================================================================
    # 2. HTTPS SERVER: SSL Termination, Security Headers & Reverse Proxy
    # Lắng nghe tại cổng unprivileged 8443 (được Docker map ra host 443)
    # ==========================================================================
    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        server_name localhost eventify26.local;

        # Cấu hình SSL / TLS
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Chèn Security Headers chuẩn OWASP
        include /etc/nginx/snippets/security-headers.conf;

        # Proxy Headers dùng chung
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # --- ĐỊNH TUYẾN 1: API BACKEND (Áp dụng Rate Limiting) ---
        location /api/ {
            limit_req zone=api_rate_limit burst=20 nodelay;
            
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # --- ĐỊNH TUYẾN 2: HEALTH CHECK & PROMETHEUS METRICS (Backend) ---
        location /health {
            proxy_pass http://backend:3000/health;
        }

        location /metrics {
            proxy_pass http://backend:3000/metrics;
        }

        # --- ĐỊNH TUYẾN 3: PGADMIN 4 ---
        location /pgadmin/ {
            proxy_pass http://pgadmin:80/;
            proxy_http_version 1.1;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_buffering off;
        }

        # --- ĐỊNH TUYẾN 4: GRAFANA (sub-path /grafana/) ---
        location /grafana/ {
            proxy_pass http://grafana:3000/grafana/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Hỗ trợ WebSocket (live reload Grafana)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 90s;
            proxy_buffering off;
        }

        # --- ĐỊNH TUYẾN 5: PROMETHEUS (basic auth qua .htpasswd) ---
        location /prometheus/ {
            # Xác thực Basic Auth - chỉ admin hệ thống mới truy cập
            auth_basic "Prometheus - Restricted Access";
            auth_basic_user_file /etc/nginx/auth/.htpasswd_prometheus;

            proxy_pass http://prometheus:9090/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Xóa Authorization header sau khi đã xác thực, tránh truyền xuống Prometheus
            proxy_set_header Authorization "";

            proxy_read_timeout 90s;
            proxy_buffering off;
        }

        # --- ĐỊNH TUYẾN 6: FRONTEND SPA (React) ---
        location / {
            proxy_pass http://frontend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
