# ==============================================================================
# Security Headers Snippet for Nginx Reverse Proxy
# Tuân thủ OWASP Secure Headers Project
# ==============================================================================

# HSTS (HTTP Strict Transport Security) - Ép buộc trình duyệt chỉ dùng HTTPS
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Chống tấn công Clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Chống MIME Type Confusion / Sniffing
add_header X-Content-Type-Options "nosniff" always;

# Bảo vệ quyền riêng tư qua Referrer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Giới hạn API phần cứng trình duyệt (Hardware Permissions Policy)
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

# Content Security Policy (CSP)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; frame-ancestors 'self';" always;
