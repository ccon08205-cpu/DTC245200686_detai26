global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Thu thập metrics từ chính Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Thu thập metrics từ Backend Node.js của Đề 26
  - job_name: 'eventify-backend'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:3000']
        labels:
          app: 'eventify-backend'
          environment: 'production'
          detai: '26'
