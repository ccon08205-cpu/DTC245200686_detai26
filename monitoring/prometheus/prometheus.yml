# ==============================================================================
# Prometheus Configuration - Đề 26: Hệ thống Quản lý Sự kiện
# Thu thập metrics 15s/lần từ tất cả targets trong hệ thống
# ==============================================================================

global:
  scrape_interval: 15s          # Mặc định: thu thập metrics mỗi 15 giây
  evaluation_interval: 15s      # Đánh giá alert rules mỗi 15 giây
  scrape_timeout: 10s

  # Label chung gắn vào tất cả time-series
  external_labels:
    cluster: "eventify-detai26"
    environment: "production"

# Nạp file khai báo Alert Rules
rule_files:
  - "alerts.yml"

# ==============================================================================
# Scrape Configurations - Danh sách các targets để thu thập metrics
# ==============================================================================
scrape_configs:

  # ----------------------------------------------------------------------------
  # 1. Prometheus tự giám sát chính nó
  # ----------------------------------------------------------------------------
  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # ----------------------------------------------------------------------------
  # 2. Backend Node.js Express (prom-client metrics tại /metrics)
  # ----------------------------------------------------------------------------
  - job_name: "eventify-backend"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:3000"]
        labels:
          service: "backend"
          app: "eventify"
          detai: "26"

  # ----------------------------------------------------------------------------
  # 3. cAdvisor - Giám sát CPU/RAM/Network của toàn bộ container Docker
  # ----------------------------------------------------------------------------
  - job_name: "cadvisor"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: "cadvisor"

  # ----------------------------------------------------------------------------
  # 4. Postgres Exporter - Giám sát PostgreSQL Database
  # ----------------------------------------------------------------------------
  - job_name: "postgres"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres"
          database: "eventdb"

  # ----------------------------------------------------------------------------
  # 5. Nginx Exporter - Giám sát Nginx stub_status
  # ----------------------------------------------------------------------------
  - job_name: "nginx"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: "nginx"
