# ==============================================================================
# Grafana Datasource Provisioning - Đề 26: Hệ thống Quản lý Sự kiện
# Tự động nạp datasource khi Grafana khởi động
# ==============================================================================

apiVersion: 1

datasources:
  # ----------------------------------------------------------------------------
  # Prometheus - Datasource mặc định cho metrics
  # ----------------------------------------------------------------------------
  - name: Prometheus
    type: prometheus
    uid: prometheus_ds
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: "3.13.4"
      cacheLevel: "High"
      disableRecordingRules: false
      incrementalQueryOverlap: "10m"

  # ----------------------------------------------------------------------------
  # Loki - Datasource cho tập trung Log (LogQL)
  # ----------------------------------------------------------------------------
  - name: Loki
    type: loki
    uid: loki_ds
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
