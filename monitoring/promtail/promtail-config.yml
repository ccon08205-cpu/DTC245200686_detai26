# ==============================================================================
# Promtail 3.6 Configuration - Đề 26: Hệ thống Quản lý Sự kiện
# Thu thập Docker container logs (json-file) và đẩy về Loki
# ==============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      # Lọc các container thuộc project đề tài 26
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'dtc245200686_detai26'
        action: keep
    pipeline_stages:
      - docker: {}
